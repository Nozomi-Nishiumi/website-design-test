<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<title>ミサイル追跡 A/B 比較</title>
<style>
html,body{margin:0;background:#000;color:#fff;font:13px/1.5 monospace;height:100%}
.bar{height:30px;line-height:30px;padding:0 12px;background:#111;color:#ccc}
.wrap{display:flex;height:calc(100% - 30px)}
.wrap>div{flex:1;position:relative;border-left:1px solid #333}
iframe{width:100%;height:100%;border:0;display:block}
h2{position:absolute;top:8px;left:12px;z-index:2;margin:0;font-size:14px;color:#ffd98a;text-shadow:0 1px 4px #000;pointer-events:none}
</style></head><body>
<div class="bar">カーソル移動は左右両パネルに同時注入(相対座標)。クリック(カメラ切替)はカーソルが乗っている側のみ。</div>
<div class="wrap">
  <div><h2>旧版(修正前 8afb397)</h2><iframe id="a" src="old_missile.html"></iframe></div>
  <div><h2>現行(20260805a)</h2><iframe id="b" src="missile.html?v=20260805a"></iframe></div>
</div>
<script>
addEventListener('mousemove', function (e) {
  var fa = document.getElementById('a'), fb = document.getElementById('b');
  var ra = fa.getBoundingClientRect(), rb = fb.getBoundingClientRect();
  var ref = (e.clientX >= rb.left) ? rb : ra; // カーソルが乗っている側を基準に相対座標化
  var relX = (e.clientX - ref.left) / ref.width;
  var relY = (e.clientY - ref.top) / ref.height;
  [[fa, ra], [fb, rb]].forEach(function (p) {
    var w = p[0].contentWindow, r = p[1];
    if (w && w.__missileInput) w.__missileInput.move(relX * r.width, relY * r.height);
  });
}, true);
</script>
</body></html>
