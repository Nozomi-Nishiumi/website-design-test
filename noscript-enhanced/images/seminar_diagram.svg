<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 522" fill="none" role="img" aria-label="研究活動を通じて磨かれる力の概念図" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <!-- 半透明の下地パネル -->
  <rect x="1" y="1" width="638" height="520" rx="16" fill="rgba(8,14,20,0.6)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- 箱1: 研究テーマ(専門性) -->
  <rect x="70" y="26" width="500" height="110" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <text x="320" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="rgba(100,220,200,0.95)">研究テーマ ＝ 専門性を培う</text>
  <text x="320" y="82" text-anchor="middle" font-size="17" fill="rgba(255,255,255,0.92)">行動生物学・人間行動科学・コンピュータサイエンス</text>
  <text x="320" y="108" text-anchor="middle" font-size="15" fill="rgba(255,255,255,0.7)">応用分野（スポーツ、害獣対策 など）</text>

  <!-- 矢印1 -->
  <line x1="320" y1="140" x2="320" y2="172" stroke="rgba(100,220,200,0.9)" stroke-width="2.5"/>
  <polygon points="312,170 328,170 320,184" fill="rgba(100,220,200,0.9)"/>
  <text x="336" y="164" font-size="14" fill="rgba(100,220,200,0.9)">研究の過程で磨かれる力</text>

  <!-- 磨かれる力: 上段3つ -->
  <rect x="26" y="192" width="188" height="64" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <text x="120" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="rgba(255,255,255,0.92)">論理を組む力</text>
  <text x="120" y="242" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.65)">総合的・抽象的に捉える</text>

  <rect x="226" y="192" width="188" height="64" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="rgba(255,255,255,0.92)">公正に整理する力</text>
  <text x="320" y="242" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.65)">様々な解釈に思考を巡らせる</text>

  <rect x="426" y="192" width="188" height="64" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <text x="520" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="rgba(255,255,255,0.92)">説明する力</text>
  <text x="520" y="242" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.65)">相手の視点に立って伝える</text>

  <!-- 磨かれる力: 下段2つ -->
  <rect x="72" y="270" width="240" height="64" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <text x="192" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="rgba(255,255,255,0.92)">自律と連携</text>
  <text x="192" y="320" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.65)">自ら取り組み、他者と力を合わせる</text>

  <rect x="328" y="270" width="240" height="64" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <text x="448" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="rgba(255,255,255,0.92)">柔軟な適応と計画修正</text>
  <text x="448" y="320" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.65)">先進技術や想定外に対応する</text>

  <!-- 矢印2 -->
  <line x1="320" y1="344" x2="320" y2="376" stroke="rgba(100,220,200,0.9)" stroke-width="2.5"/>
  <polygon points="312,374 328,374 320,388" fill="rgba(100,220,200,0.9)"/>

  <!-- 箱2: 得られるもの -->
  <rect x="60" y="396" width="520" height="102" rx="12" fill="rgba(100,220,200,0.07)" stroke="rgba(100,220,200,0.55)" stroke-width="1.5"/>
  <text x="320" y="430" text-anchor="middle" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.95)">論理的で主観に捉われない思考</text>
  <text x="320" y="456" text-anchor="middle" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.95)">＋ プロジェクトマネジメント能力</text>
  <text x="320" y="484" text-anchor="middle" font-size="14" fill="rgba(100,220,200,0.95)">→ 将来の様々な場面で活きる経験に</text>
</svg>
